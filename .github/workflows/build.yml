name: Build OrcaGlass APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract OrcaGlass.zip and find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="$GITHUB_WORKSPACE/.orcaglass-build"
          mkdir -p "$WORK_DIR"

          ZIP_PATH="$(find "$GITHUB_WORKSPACE" -type f -iname 'OrcaGlass.zip' -not -path '*/.git/*' -print -quit || true)"

          if [ -n "$ZIP_PATH" ]; then
            echo "Archive trouvée : $ZIP_PATH"
            unzip -oq "$ZIP_PATH" -d "$WORK_DIR"
          else
            echo "Pas de fichier OrcaGlass.zip : recherche d'un projet déjà décompressé."
          fi

          SETTINGS_FILE="$(find "$WORK_DIR" "$GITHUB_WORKSPACE" \
            -type f -name 'settings.gradle.kts' \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit 2>/dev/null || true)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERREUR : settings.gradle.kts introuvable."
            echo "Contenu du dépôt (premiers niveaux) :"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -print | sort | head -200
            if [ -n "$ZIP_PATH" ]; then
              echo "Contenu de l'archive :"
              unzip -l "$ZIP_PATH" | head -100
            fi
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERREUR : module app introuvable dans : $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 4 -type f -print | sort | head -200
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERREUR : AndroidManifest.xml introuvable dans app/src/main."
            exit 1
          fi

          echo "Projet Android trouvé : $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Compile APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OrcaGlass-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
