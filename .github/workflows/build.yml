name: Build OrcaGlass APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile OrcaGlass
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Find Android project directory
        id: locate
        shell: bash
        run: |
          SETTINGS_FILE="$(find . -type f -name 'settings.gradle.kts' \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERREUR : settings.gradle.kts introuvable."
            echo "Vérifie que tu as décompressé OrcaGlass.zip et envoyé son CONTENU dans le dépôt GitHub."
            echo "Fichiers Gradle trouvés :"
            find . -maxdepth 6 -type f \( -name 'settings.gradle*' -o -name 'build.gradle*' \) -print || true
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERREUR : app/build.gradle.kts introuvable dans $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 4 -type f -print | sort
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERREUR : AndroidManifest.xml introuvable dans $PROJECT_DIR/app/src/main/"
            exit 1
          fi

          # GitHub Actions exige un chemin relatif pour working-directory.
          PROJECT_DIR="${PROJECT_DIR#./}"
          if [ -z "$PROJECT_DIR" ]; then PROJECT_DIR="."; fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projet Android détecté dans : $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: ${{ steps.locate.outputs.project_dir }}/**/*.gradle*

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: OrcaGlass-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
